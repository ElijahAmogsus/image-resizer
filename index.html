<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer & Cropper | ElijahAmogsus</title>
  <style>
    :root {
      --base: #1e1e2e; --mantle: #181825; --surface0: #313244;
      --surface1: #45475a; --text: #cdd6f4; --subtext0: #a6adc8;
      --accent: #89b4fa; --crust: #11111b;
    }
    * { box-sizing: border-box; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body {
      margin: 0; min-height: 100vh; background: var(--base); color: var(--text);
      font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 25px 16px;
    }
    .theme-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .theme-btn, .accent-select {
      background: var(--mantle); color: var(--text); border: 2px solid var(--surface1);
      border-radius: 6px; padding: 6px 12px; font-family: monospace; font-weight: bold; cursor: pointer;
    }
    .theme-btn:hover, .theme-btn.active, .accent-select:hover, .accent-select:focus {
      border-color: var(--accent); background: var(--surface0); outline: none;
    }
    h1 { color: var(--accent); margin: 0 0 6px 0; text-align: center; font-size: clamp(1.4rem, 5vw, 1.8rem); }
    p { color: var(--subtext0); margin: 0 0 24px 0; text-align: center; }
    .box {
      background: var(--mantle); border: 2px solid var(--surface1); border-radius: 12px;
      padding: 22px; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    input[type="file"] { width: 100%; color: var(--text); font-family: monospace; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
    input[type="number"] {
      width: 82px; padding: 7px; border-radius: 6px; border: 2px solid var(--surface1);
      background: var(--surface0); color: var(--text); font-family: monospace; font-weight: bold; text-align: center;
    }
    .check-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; font-size: 0.92rem; }
    .canvas-wrap {
      position: relative; display: none; max-width: 100%; touch-action: none; user-select: none;
    }
    #previewCanvas {
      display: block; max-width: 100%; max-height: 300px; border: 2px solid var(--accent); border-radius: 6px;
    }
    #cropOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; cursor: crosshair;
    }
    .btn {
      background: var(--accent); color: var(--crust); border: none; border-radius: 6px;
      padding: 8px 14px; font-family: monospace; font-weight: bold; cursor: pointer;
    }
    .btn.secondary { background: var(--surface0); color: var(--text); border: 2px solid var(--surface1); }
    .btn:disabled { background: var(--surface1); color: var(--subtext0); cursor: not-allowed; }
    a.back { margin-top: 25px; color: var(--accent); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('mocha')">🌿 Mocha</button>
    <button class="theme-btn" onclick="setTheme('macchiato')">🌺 Macchiato</button>
    <button class="theme-btn" onclick="setTheme('frappe')">🪴 Frappé</button>
    <button class="theme-btn" onclick="setTheme('latte')">🌻 Latte</button>
    <select id="accentSelect" class="accent-select" onchange="setAccent(this.value)" aria-label="Accent Color">
      <option value="rosewater">🌸 Rosewater</option>
      <option value="flamingo">🦩 Flamingo</option>
      <option value="pink">💖 Pink</option>
      <option value="mauve">🔮 Mauve</option>
      <option value="red">🍎 Red</option>
      <option value="maroon">🍒 Maroon</option>
      <option value="peach">🍑 Peach</option>
      <option value="yellow">🍋 Yellow</option>
      <option value="green">🍏 Green</option>
      <option value="teal">🌊 Teal</option>
      <option value="sky">☁️ Sky</option>
      <option value="sapphire">💎 Sapphire</option>
      <option value="blue" selected>💙 Blue</option>
      <option value="lavender">🪻 Lavender</option>
    </select>
  </div>

  <h1>📐 Image Resizer & Cropper</h1>
  <p>Crop with corner handles, resize photos, or upscale crisp pixel art</p>

  <div class="box">
    <input type="file" id="imgUpload" accept="image/*">
    <div id="origInfo" style="color: var(--subtext0); font-size: 0.88rem;">No image loaded</div>

    <div class="controls">
      <button class="btn secondary" id="cropToggleBtn" onclick="toggleCrop()" disabled>✂️ Crop Mode</button>
      <button class="btn" id="applyCropBtn" onclick="applyCrop()" style="display:none;">✅ Apply Crop</button>
      <button class="btn secondary" id="resetBtn" onclick="resetImage()" style="display:none;">↩️ Reset</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="previewCanvas"></canvas>
      <canvas id="cropOverlay"></canvas>
    </div>

    <div class="controls">
      <label>W: <input type="number" id="wInput" value="1080" min="1" max="4096"></label>
      <label>H: <input type="number" id="hInput" value="1080" min="1" max="4096"></label>
    </div>

    <div class="check-row">
      <label><input type="checkbox" id="lockRatio" checked> Lock Aspect Ratio</label>
      <label><input type="checkbox" id="pixelCrisp"> Pixel Art (Crisp)</label>
    </div>

    <button class="btn" id="dlBtn" onclick="downloadResized()" disabled>⬇️ Download PNG</button>
  </div>

  <a class="back" href="/">← Back to Dev Hub</a>

  <script>
    const themes = {
      mocha: {
        base: '#1e1e2e', mantle: '#181825', surface0: '#313244', surface1: '#45475a', text: '#cdd6f4', subtext0: '#a6adc8', crust: '#11111b',
        accents: { rosewater: '#f5e0dc', flamingo: '#f2cdcd', pink: '#f5c2e7', mauve: '#cba6f7', red: '#f38ba8', maroon: '#eba0ac', peach: '#fab387', yellow: '#f9e2af', green: '#a6e3a1', teal: '#94e2d5', sky: '#89dceb', sapphire: '#74c7ec', blue: '#89b4fa', lavender: '#b4befe' }
      },
      macchiato: {
        base: '#24273a', mantle: '#1e2030', surface0: '#363a4f', surface1: '#494d64', text: '#cad3f5', subtext0: '#a5adcb', crust: '#181926',
        accents: { rosewater: '#f4dbd6', flamingo: '#f0c6c6', pink: '#f5bde6', mauve: '#c6a0f6', red: '#ed8796', maroon: '#ee99a0', peach: '#f5a97f', yellow: '#eed49f', green: '#a6da95', teal: '#8bd5ca', sky: '#91d7e3', sapphire: '#7dc4e4', blue: '#8aadf4', lavender: '#b7bdf8' }
      },
      frappe: {
        base: '#303446', mantle: '#292c3c', surface0: '#414559', surface1: '#51576d', text: '#c6d0f5', subtext0: '#a5adce', crust: '#232634',
        accents: { rosewater: '#f2d5cf', flamingo: '#eebebe', pink: '#f4b8e4', mauve: '#ca9ee6', red: '#e78284', maroon: '#ea999c', peach: '#ef9f76', yellow: '#e5c890', green: '#a6d189', teal: '#81c8be', sky: '#99d1db', sapphire: '#85c1dc', blue: '#8caaee', lavender: '#babbf1' }
      },
      latte: {
        base: '#eff1f5', mantle: '#e6e9ef', surface0: '#ccd0da', surface1: '#bcc0cc', text: '#4c4f69', subtext0: '#6c6f85', crust: '#eff1f5',
        accents: { rosewater: '#dc8a78', flamingo: '#dd7878', pink: '#ea76cb', mauve: '#8839ef', red: '#d20f39', maroon: '#e64553', peach: '#fe640b', yellow: '#df8e1d', green: '#40a02b', teal: '#179299', sky: '#04a5e5', sapphire: '#209fb5', blue: '#1e66f5', lavender: '#7287fd' }
      }
    };

    let currentTheme = localStorage.getItem('catppuccin-theme') || 'mocha';
    let currentAccent = localStorage.getItem('catppuccin-accent') || 'blue';

    function applyPalette() {
      const p = themes[currentTheme] || themes.mocha;
      const root = document.documentElement.style;
      for (const [k, v] of Object.entries(p)) if (k !== 'accents') root.setProperty(`--${k}`, v);
      root.setProperty('--accent', p.accents[currentAccent] || p.accents.blue);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(`'${currentTheme}'`)));
      document.getElementById('accentSelect').value = currentAccent;
      if (cropping) drawCropOverlay();
    }
    function setTheme(name) { currentTheme = name; localStorage.setItem('catppuccin-theme', name); applyPalette(); }
    function setAccent(accent) { currentAccent = accent; localStorage.setItem('catppuccin-accent', accent); applyPalette(); }
    applyPalette();
    const imgUpload = document.getElementById('imgUpload'), origInfo = document.getElementById('origInfo');
    const wInput = document.getElementById('wInput'), hInput = document.getElementById('hInput');
    const lockRatio = document.getElementById('lockRatio'), pixelCrisp = document.getElementById('pixelCrisp');
    const canvasWrap = document.getElementById('canvasWrap');
    const previewCanvas = document.getElementById('previewCanvas'), pCtx = previewCanvas.getContext('2d');
    const cropOverlay = document.getElementById('cropOverlay'), cCtx = cropOverlay.getContext('2d');
    const cropToggleBtn = document.getElementById('cropToggleBtn'), applyCropBtn = document.getElementById('applyCropBtn');
    const resetBtn = document.getElementById('resetBtn'), dlBtn = document.getElementById('dlBtn');

    let originalImg = null, workingImg = null, aspect = 1, cropping = false;
    let cropBox = { x: 20, y: 20, w: 120, h: 120 }, dragMode = null, dragStart = { x: 0, y: 0 };

    function renderPreview() {
      if (!workingImg) return;
      const w = Math.max(1, Math.min(4096, parseInt(wInput.value) || workingImg.width));
      const h = Math.max(1, Math.min(4096, parseInt(hInput.value) || workingImg.height));
      previewCanvas.width = w; previewCanvas.height = h;
      previewCanvas.style.imageRendering = pixelCrisp.checked ? 'pixelated' : 'auto';
      pCtx.imageSmoothingEnabled = !pixelCrisp.checked;
      pCtx.clearRect(0, 0, w, h);
      pCtx.drawImage(workingImg, 0, 0, w, h);
      if (cropping) syncOverlaySize();
    }

    function syncOverlaySize() {
      const rect = previewCanvas.getBoundingClientRect();
      cropOverlay.width = rect.width;
      cropOverlay.height = rect.height;
      drawCropOverlay();
    }

    function drawCropOverlay() {
      const w = cropOverlay.width, h = cropOverlay.height;
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#89b4fa';
      cCtx.clearRect(0, 0, w, h);

      cCtx.fillStyle = 'rgba(0, 0, 0, 0.52)';
      cCtx.fillRect(0, 0, w, h);
      cCtx.clearRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);

      cCtx.save();
      cCtx.strokeStyle = accentColor;
      cCtx.lineWidth = 2.5;
      cCtx.setLineDash([8, 6]);
      cCtx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
      cCtx.restore();

      const len = 18;
      const corners = [
        [cropBox.x, cropBox.y, 1, 1],
        [cropBox.x + cropBox.w, cropBox.y, -1, 1],
        [cropBox.x, cropBox.y + cropBox.h, 1, -1],
        [cropBox.x + cropBox.w, cropBox.y + cropBox.h, -1, -1]
      ];
      corners.forEach(([cx, cy, dx, dy]) => {
        cCtx.beginPath();
        cCtx.moveTo(cx + dx * len, cy);
        cCtx.lineTo(cx, cy);
        cCtx.lineTo(cx, cy + dy * len);
        cCtx.lineWidth = 7;
        cCtx.lineCap = 'round';
        cCtx.lineJoin = 'round';
        cCtx.strokeStyle = accentColor;
        cCtx.stroke();

        cCtx.lineWidth = 3;
        cCtx.strokeStyle = '#ffffff';
        cCtx.stroke();
      });
    }

    function toggleCrop() {
      if (!workingImg) return;
      cropping = !cropping;
      cropOverlay.style.display = cropping ? 'block' : 'none';
      applyCropBtn.style.display = cropping ? 'inline-block' : 'none';
      cropToggleBtn.textContent = cropping ? '❌ Cancel Crop' : '✂️ Crop Mode';
      if (cropping) {
        const rect = previewCanvas.getBoundingClientRect();
        cropOverlay.width = rect.width;
        cropOverlay.height = rect.height;
        cropBox = { x: rect.width * 0.15, y: rect.height * 0.15, w: rect.width * 0.7, h: rect.height * 0.7 };
        drawCropOverlay();
      }
    }

    function getPos(e) {
      const rect = cropOverlay.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function hitTest(pos) {
      const r = 24;
      const { x, y, w, h } = cropBox;
      if (Math.hypot(pos.x - x, pos.y - y) < r) return 'tl';
      if (Math.hypot(pos.x - (x + w), pos.y - y) < r) return 'tr';
      if (Math.hypot(pos.x - x, pos.y - (y + h)) < r) return 'bl';
      if (Math.hypot(pos.x - (x + w), pos.y - (y + h)) < r) return 'br';
      if (pos.x > x && pos.x < x + w && pos.y > y && pos.y < y + h) return 'move';
      return null;
    }

    function onDown(e) {
      if (!cropping) return;
      const pos = getPos(e);
      dragMode = hitTest(pos);
      if (dragMode) { e.preventDefault(); dragStart = { x: pos.x, y: pos.y, box: { ...cropBox } }; }
    }

    function onMove(e) {
      if (!dragMode) return;
      e.preventDefault();
      const pos = getPos(e);
      const dx = pos.x - dragStart.x, dy = pos.y - dragStart.y;
      const b = dragStart.box, minS = 24, maxW = cropOverlay.width, maxH = cropOverlay.height;

      if (dragMode === 'move') {
        cropBox.x = Math.max(0, Math.min(maxW - b.w, b.x + dx));
        cropBox.y = Math.max(0, Math.min(maxH - b.h, b.y + dy));
      } else if (dragMode === 'tl') {
        const nx = Math.max(0, Math.min(b.x + b.w - minS, b.x + dx));
        const ny = Math.max(0, Math.min(b.y + b.h - minS, b.y + dy));
        cropBox = { x: nx, y: ny, w: b.x + b.w - nx, h: b.y + b.h - ny };
      } else if (dragMode === 'tr') {
        const nw = Math.max(minS, Math.min(maxW - b.x, b.w + dx));
        const ny = Math.max(0, Math.min(b.y + b.h - minS, b.y + dy));
        cropBox = { x: b.x, y: ny, w: nw, h: b.y + b.h - ny };
      } else if (dragMode === 'bl') {
        const nx = Math.max(0, Math.min(b.x + b.w - minS, b.x + dx));
        const nh = Math.max(minS, Math.min(maxH - b.y, b.h + dy));
        cropBox = { x: nx, y: b.y, w: b.x + b.w - nx, h: nh };
      } else if (dragMode === 'br') {
        cropBox.w = Math.max(minS, Math.min(maxW - b.x, b.w + dx));
        cropBox.h = Math.max(minS, Math.min(maxH - b.y, b.h + dy));
      }
      drawCropOverlay();
    }

    function onUp() { dragMode = null; }

    cropOverlay.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    cropOverlay.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);

    function applyCrop() {
      const scaleX = previewCanvas.width / cropOverlay.width;
      const scaleY = previewCanvas.height / cropOverlay.height;
      const sx = Math.round(cropBox.x * scaleX);
      const sy = Math.round(cropBox.y * scaleY);
      const sw = Math.max(1, Math.round(cropBox.w * scaleX));
      const sh = Math.max(1, Math.round(cropBox.h * scaleY));

      const temp = document.createElement('canvas');
      temp.width = sw; temp.height = sh;
      temp.getContext('2d').drawImage(previewCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

      const newImg = new Image();
      newImg.onload = () => {
        workingImg = newImg;
        aspect = sw / sh;
        wInput.value = sw; hInput.value = sh;
        origInfo.textContent = `Cropped: ${sw} × ${sh} px`;
        resetBtn.style.display = 'inline-block';
        toggleCrop();
        renderPreview();
      };
      newImg.src = temp.toDataURL('image/png');
    }

    function resetImage() {
      if (!originalImg) return;
      workingImg = originalImg;
      aspect = originalImg.width / originalImg.height;
      wInput.value = originalImg.width; hInput.value = originalImg.height;
      origInfo.textContent = `Original: ${originalImg.width} × ${originalImg.height} px`;
      resetBtn.style.display = 'none';
      if (cropping) toggleCrop();
      renderPreview();
    }

    imgUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          originalImg = img; workingImg = img;
          aspect = img.width / img.height;
          wInput.value = img.width; hInput.value = img.height;
          origInfo.textContent = `Original: ${img.width} × ${img.height} px`;
          canvasWrap.style.display = 'inline-block';
          cropToggleBtn.disabled = false; dlBtn.disabled = false;
          resetBtn.style.display = 'none';
          if (cropping) toggleCrop();
          renderPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    wInput.oninput = () => {
      if (lockRatio.checked && workingImg) hInput.value = Math.max(1, Math.round(wInput.value / aspect));
      renderPreview();
    };
    hInput.oninput = () => {
      if (lockRatio.checked && workingImg) wInput.value = Math.max(1, Math.round(hInput.value * aspect));
      renderPreview();
    };
    pixelCrisp.onchange = renderPreview;

    function downloadResized() {
      if (!workingImg) return;
      const link = document.createElement('a');
      link.download = `edited-${wInput.value}x${hInput.value}.png`;
      link.href = previewCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
